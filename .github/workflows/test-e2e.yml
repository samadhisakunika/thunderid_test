name: E2E Tests

on:
  pull_request:

permissions: {}

jobs:
  test-e2e:
    permissions:
      contents: read
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: operator
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: operator/go.mod

      - name: Cache tool binaries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: operator/bin
          key: ${{ runner.os }}-operator-tools-${{ hashFiles('operator/Makefile') }}

      - name: Install the latest version of kind
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/latest/kind-linux-$(go env GOARCH)
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind

      - name: Verify kind installation
        run: kind version

      - name: Running Test e2e
        env:
          # No webhooks are defined in this operator (config/default/kustomization.yaml has every
          # [WEBHOOK] section commented out), so cert-manager - which only exists to provision
          # webhook TLS certs - is unnecessary. Skipping it removes a small amount of setup time.
          CERT_MANAGER_INSTALL_SKIP: "true"
        run: |
          go mod tidy
          make test-e2e
