name: Tests

on:
  pull_request:

permissions: {}

jobs:
  test:
    permissions:
      contents: read
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: operator
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: operator/go.mod

      - name: Cache tool binaries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: operator/bin
          key: ${{ runner.os }}-operator-tools-${{ hashFiles('operator/Makefile') }}

      - name: Verify Helm chart CRDs are in sync with config/crd/bases
        run: |
          make manifests
          git diff --exit-code -- config/crd/bases charts/thunderid-operator/crds || \
            (echo "::error::Generated CRDs and/or charts/thunderid-operator/crds are out of date. Run 'make manifests' locally and commit the result." && exit 1)

      - name: Running Tests
        run: |
          go mod tidy
          make test-unit
