apiVersion: apps.thunderid.io/v1alpha1
kind: ThunderIDInstance
metadata:
  name: thunderid-prod
  namespace: default
spec:
  image: ghcr.io/thunder-id/thunderid:latest
  replicas: 1

  # SQLite (image's built-in DB), persisted across restarts via a PVC. Required:
  # either this or every config.database scope's type=postgres — neither set is rejected.
  dataVolumeSize: "1Gi"

  # Every key in the Secret named by whichever EnvironmentValues is labeled
  # thunderid.io/instance: thunderid-prod becomes an env var on the ThunderID container — any
  # Resource bound to this instance can reference one via a {{.KEY}} placeholder anywhere in its
  # spec (e.g. Admin2User.yaml's credentials.password). See Admin2User_credentials.yaml, which
  # carries that label.

  resources:
    requests:
      cpu: "100m"
      memory: "64Mi"
    limits:
      cpu: "500m"
      memory: "128Mi"

  # config groups everything that maps directly into ThunderID's own deployment.yaml, mirroring
  # its own top-level blocks (database:/tls:/jwt:/passkey:/email:) 1:1 — see
  # thunderidinstance.yaml for the postgres variant and field-by-field notes.
  config:
    database:
      # sqlite — same as every field the image's own built-in default already uses. Written out
      # explicitly here so it's visible/editable; when spec.config.database is omitted entirely
      # instead, the operator leaves this exact content untouched anyway (see
      # staticSQLiteDatabaseSection in database_config.go).
      config:
        type: sqlite
        sqlite:
          path: "repository/database/configdb.db"
          options: "_journal_mode=WAL&_busy_timeout=5000&_pragma=foreign_keys(1)"
          maxOpenConns: 500
          maxIdleConns: 100
          connMaxLifetime: 3600
      runtimeTransient:
        type: sqlite
        sqlite:
          path: "repository/database/runtime_transient.db"
          options: "_journal_mode=WAL&_busy_timeout=5000&_pragma=foreign_keys(1)"
          maxOpenConns: 500
          maxIdleConns: 100
          connMaxLifetime: 3600
      entity:
        type: sqlite
        sqlite:
          path: "repository/database/entitydb.db"
          options: "_journal_mode=WAL&_busy_timeout=5000&_pragma=foreign_keys(1)"
          maxOpenConns: 500
          maxIdleConns: 100
          connMaxLifetime: 3600
      runtimePersistent:
        type: sqlite
        sqlite:
          path: "repository/database/runtime_persistent.db"
          options: "_journal_mode=WAL&_busy_timeout=5000&_pragma=foreign_keys(1)"
          maxOpenConns: 500
          maxIdleConns: 100
          connMaxLifetime: 3600

    port: 8091
    tls:
      minVersion: "1.3"
    jwt:
      preferredKeyId: "default-key"

    # passkey:
    #   extraAllowedOrigins:
    #     - "https://extra-frontend.example.com"

    # email:
    #   smtp:
    #     host: "smtp.example.com"
    #     port: 587
    #     fromAddress: "noreply@example.com"
    #     enableStartTLS: true
    #     enableAuthentication: false
    #     secretRef:
    #       name: my-smtp-secret
    #       key: password