# external-pg-instance's Environment, demonstrating all four sections in one file (see
# EnvironmentSpec's doc comment).
#
# credentials.secretRef: this predates the sectioned-Environment redesign, so the Secret named
# external-pg-instance-env already existed (created back when Environment was a single flat
# spec.env object of the same name) holding TEST_RESOURCE_USER_PASSWORD. Pointing secretRef at it
# reuses that Secret exactly as it was — see environment_controller.go's "adopted"/passthrough
# path — no plaintext round-trip needed.
#
# security.env: dedicated self-signed cert/key material generated for this instance specifically
# (not reused from thunderid-prod-manual-security.yaml or anywhere else), the same way that file's
# own header comment documents:
#   openssl req -x509 -nodes -days 365 -newkey rsa:2048 -keyout server.key -out server.cert \
#     -subj "/O=WSO2/OU=ThunderID/CN=localhost" -addext "subjectAltName=DNS:localhost,IP:127.0.0.1"
#   openssl req -x509 -nodes -days 365 -newkey rsa:2048 -keyout signing.key -out signing.cert \
#     -subj "/O=WSO2/OU=ThunderID/CN=localhost" -addext "subjectAltName=DNS:localhost,IP:127.0.0.1"
#   openssl ecparam -name prime256v1 -genkey -noout -param_enc named_curve -out ecdsa-signing.key
#   openssl req -new -x509 -nodes -days 3650 -key ecdsa-signing.key -out ecdsa-signing.cert \
#     -subj "/O=WSO2/OU=ThunderID/CN=localhost" -addext "subjectAltName=DNS:localhost,IP:127.0.0.1"
#   openssl rand -hex 32   # crypto.key, direct_auth_secret (written without a trailing newline)
#
# database.env: sourced from ../../postgres-db-secret.yaml (secret name "thunderid-db", the same
# Secret postgres-instance.yaml/thunderidinstance.yaml reference via
# spec.config.database.secretRef today).
#
# smtp: no SMTP secret is checked into this repo yet (thunderidinstance.yaml's own email block is
# commented out with a "my-smtp-secret" placeholder name and no backing file) - left unset here
# rather than inventing a fake one; see the shape in the commented-out block at the bottom.
#
# Migrating an existing (pre-sectioned-schema) Environment object: kubectl apply --server-side can
# fail with ".status.keys: expected map, got &{[...]}" - the stored status subresource is still
# the old []string shape, which conflicts with the new map[string][]string one under SSA's typed
# merge. Fix: kubectl delete environment <name> && kubectl apply --server-side -f <file> - the
# generated Secret has no owner reference (deliberately, see Environment's own doc comment) so
# deleting the Environment object never deletes it.
#
# Apply with `kubectl apply --server-side -f test-resource-user-secret.yaml`, not plain
# `kubectl apply` — plain apply stores this file's plaintext verbatim in the
# kubectl.kubernetes.io/last-applied-configuration annotation forever, bypassing the masking
# above entirely (see operator/gitops/README.md). First switch-over on an already-existing
# object may need `--force-conflicts` once.
apiVersion: apps.thunderid.io/v1alpha1
kind: Environment
metadata:
  name: external-pg-instance-env
  namespace: default
  labels:
    thunderid.io/instance: external-pg-instance
spec:
  credentials:
    secretRef: external-pg-instance-env
