apiVersion: apps.thunderid.io/v1alpha1
kind: ThunderIDInstance
metadata:
  name: external-pg-instance
  namespace: default
spec:
  image: ghcr.io/thunder-id/thunderid:latest
  replicas: 1

  # domain: my-instance.local
  # tlsSecret: my-tls-secret
  securitySecret: thunderid-prod-manual-security

  # resourcesConfigMap: thunderid-resources

  # Every key in the Secret named by whichever EnvironmentValues is labeled
  # thunderid.io/instance: external-pg-instance becomes an env var on the ThunderID container —
  # any Resource bound to this instance can reference one via a {{.KEY}} placeholder anywhere in
  # its spec (e.g. test-resource-user.yaml's credentials.password). See
  # test-resource-user-secret.yaml, which carries that label.

  resources:
    requests:
      cpu: "250m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"

  autoScaling:
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80

  # config groups everything that maps directly into ThunderID's own deployment.yaml, mirroring
  # its own top-level blocks (database:/tls:/jwt:/passkey:/email:) 1:1 — copy field names
  # straight from a real deployment.yaml, besides the Kubernetes-only glue (passwordRef/secretRef fields
  # source a password from a Secret since ThunderID's own password field is always a file://
  # reference; port doubles as k8s wiring).
  config:
    database:
      # ThunderID has four independent scopes. config+entity share one physical database in
      # practice, and so do runtimeTransient+runtimePersistent (see database_config.go), but
      # each is set explicitly here since ThunderID's own schema doesn't encode that pairing.
      # Each scope names its own passwordRef (Secret+key) — all four point at the same Secret and key
      # here (thunderid-db/password), the same single shared password this instance used before
      # passwordRef went per-scope; nothing stops two scopes from pointing at different keys of the same
      # Secret to give each its own password instead (see database_config_test.go).
      config:
        type: postgres
        postgres:
          hostname: "172.19.208.1"
          port: "5432"
          username: "postgres"
          name: "thunderid_config"
          sslmode: "disable"
          passwordRef:
            name: thunderid-db
            key: password
      entity:
        type: postgres
        postgres:
          hostname: "172.19.208.1"
          port: "5432"
          username: "postgres"
          name: "thunderid_config"
          sslmode: "disable"
          passwordRef:
            name: thunderid-db
            key: password
      runtimeTransient:
        type: postgres
        postgres:
          hostname: "172.19.208.1"
          port: "5432"
          username: "postgres"
          name: "thunderid_runtime"
          sslmode: "disable"
          passwordRef:
            name: thunderid-db
            key: password
      runtimePersistent:
        type: postgres
        postgres:
          hostname: "172.19.208.1"
          port: "5432"
          username: "postgres"
          name: "thunderid_runtime"
          sslmode: "disable"
          passwordRef:
            name: thunderid-db
            key: password

    port: 8090
    tls:
      minVersion: "1.3"
    jwt:
      preferredKeyId: "default-key"

    passkey:
      extraAllowedOrigins:
        - "https://extra-frontend.example.com"

    email:
      smtp:
        host: "smtp.example.com"
        port: 587
        fromAddress: "noreply@example.com"
        enableStartTLS: true
        enableAuthentication: false
        # username: "smtp-user"
        # secretRef:
        #   name: my-smtp-secret
        #   key: password
