# Hand-authored alternative to the operator's auto-generated <instance>-security Secret.
# Reference it from the ThunderIDInstance with: spec.securitySecret: thunderid-prod-manual-security
#
# All 8 keys are required (validated by reconcileSecuritySecret); this set was generated with:
#   openssl req -x509 -nodes -days 365 -newkey rsa:2048 -keyout server.key -out server.cert \
#     -subj "/O=WSO2/OU=ThunderID/CN=localhost" -addext "subjectAltName=DNS:localhost,IP:127.0.0.1"
#   openssl req -x509 -nodes -days 365 -newkey rsa:2048 -keyout signing.key -out signing.cert \
#     -subj "/O=WSO2/OU=ThunderID/CN=localhost" -addext "subjectAltName=DNS:localhost,IP:127.0.0.1"
#   openssl ecparam -name prime256v1 -genkey -noout -param_enc named_curve -out ecdsa-signing.key
#   openssl req -new -x509 -nodes -days 3650 -key ecdsa-signing.key -out ecdsa-signing.cert \
#     -subj "/O=WSO2/OU=ThunderID/CN=localhost" -addext "subjectAltName=DNS:localhost,IP:127.0.0.1"
#   openssl rand -hex 32   # crypto.key, direct_auth_secret (written without a trailing newline)
apiVersion: v1
kind: Secret
metadata:
  name: thunderid-prod-manual-security
  namespace: default
type: Opaque
data:
  crypto.key: OWE3YzY0NjExMDMzNWNlZWJlYzJlODNkYTlmNDNjM2MzMmM4ZWM2MmMwYzc2YmFiMzRkOTE5YjNkZjViZWU1ZA==
  direct_auth_secret: ZDc5ZjcxNDRiMDFmYjA4ZmE0MTRlOTFlNzgyNzVhYmJjZTJmNzc1M2VmZjEwYmUzYWIyMzI4NjkzYjcwMzU4ZQ==
  ecdsa-signing.cert: 
  ecdsa-signing.key: 
  server.cert: 
  server.key: 
  signing.cert: 
  signing.key: 
