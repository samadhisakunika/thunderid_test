apiVersion: apps.thunderid.io/v1alpha1
kind: ThunderIDInstance
metadata:
  name: my-postgres-instance
spec:
  image: ghcr.io/thunder-id/thunderid:latest
  domain: my-instance.local
  resourcesConfigMap: thunderid-resources
  config:
    database:
      # ThunderID has four independent scopes; config+entity share one physical database, and so
      # do runtimeTransient+runtimePersistent (see README's Database section), but each is set
      # explicitly here since ThunderID's own schema doesn't encode that pairing. Each scope names
      # its own postgres.passwordRef (Secret+key) — all four share one Secret+key here, but two scopes
      # could just as well point at different keys of the same Secret to each get their own password.
      config:
        type: postgres
        postgres:
          hostname: postgres.default.svc.cluster.local
          port: "5432"
          username: postgres
          name: thunderid_config
          sslmode: disable
          passwordRef:
            name: my-postgres-db
            key: password
      entity:
        type: postgres
        postgres:
          hostname: postgres.default.svc.cluster.local
          port: "5432"
          username: postgres
          name: thunderid_config
          sslmode: disable
          passwordRef:
            name: my-postgres-db
            key: password
      runtimeTransient:
        type: postgres
        postgres:
          hostname: postgres.default.svc.cluster.local
          port: "5432"
          username: postgres
          name: thunderid_runtime
          sslmode: disable
          passwordRef:
            name: my-postgres-db
            key: password
      runtimePersistent:
        type: postgres
        postgres:
          hostname: postgres.default.svc.cluster.local
          port: "5432"
          username: postgres
          name: thunderid_runtime
          sslmode: disable
          passwordRef:
            name: my-postgres-db
            key: password
