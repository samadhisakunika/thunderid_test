# thunderid-prod's shared env file, authored via the Environment CRD rather than a hand-written
# Secret. The thunderid.io/instance label is what makes thunderid-prod auto-discover this Secret
# (see EnvironmentSpec's doc comment / thunderidConfig.yaml) — there is no envSecretRef field on
# the ThunderIDInstance side any more; the reference lives here. Applying this makes the operator
# create (or update) a Secret named thunderid-prod-env holding these key-value pairs, then mask
# each synced key's value in place here (see environment_controller.go) — this object is never
# deleted, `kubectl get environment thunderid-prod-env` keeps working. To change a value later,
# re-apply this file with new plaintext for that key.
#
# Apply with `kubectl apply --server-side -f Admin2User_credentials.yaml`, not plain
# `kubectl apply` — see test-resource-user-secret.yaml's comment for why.
apiVersion: apps.thunderid.io/v1alpha1
kind: Environment
metadata:
  name: thunderid-prod-env
  namespace: default
  labels:
    thunderid.io/instance: thunderid-prod
spec:
  env:
    ADMIN2_PASSWORD: admin2
