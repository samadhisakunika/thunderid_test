# thunderid-prod's shared env file, authored via the Environment CRD rather than a hand-written
# Secret. The thunderid.io/instance label is what makes thunderid-prod auto-discover this
# Environment (see EnvironmentSpec's doc comment / thunderidConfig.yaml) — there is no envSecretRef
# field on the ThunderIDInstance side any more; the reference lives here.
#
# credentials.secretRef, not credentials.env: this predates the sectioned-Environment redesign, so
# the Secret named thunderid-prod-env already existed (created back when Environment was a single
# flat spec.env object of the same name) holding ADMIN2_PASSWORD. Pointing secretRef at it reuses
# that Secret exactly as it was — see environment_controller.go's "adopted"/passthrough path — no
# plaintext round-trip needed. A brand-new Environment for a fresh instance would use
# credentials.env instead (see README's Env vars & {{.VAR}} placeholders section).
apiVersion: apps.thunderid.io/v1alpha1
kind: Environment
metadata:
  name: thunderid-prod-env
  namespace: default
  labels:
    thunderid.io/instance: thunderid-prod
spec:
  credentials:
    secretRef: thunderid-prod-env
