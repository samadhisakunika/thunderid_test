apiVersion: apps.thunderid.io/v1alpha1
kind: Resource
metadata:
  name: admin2
  namespace: default
  labels:
    thunderid.io/instance: thunderid-prod
spec:
  resource_type: user
  type: Person
  ouHandle: default
  attributes:
    given_name: "Admin"
    name: "Administrator"
    phone_number: "+12345678920"
    picture: "https://example.com/avatar.jpg"
    sub: "admin"
    username: "admin2"
    email: "admin@example.com"
    family_name: "User"
  credentials:
    password: '{{.ADMIN2_PASSWORD}}' # resolved from thunderid-prod's spec.envSecretRef Secret at boot — see Admin2User_credentials.yaml
