apiVersion: apps.thunderid.io/v1alpha1
kind: Application
metadata:
  name: demo-partner-app
  namespace: default
spec:
  instanceRef: thunderid-prod
  name: Demo Partner App
  description: Sample partner integration for the live-update demo
  template: browser
  ouHandle: default
  authFlowHandle: default-flow
  logoUrl: "emoji:👨‍💻"
  themeId: "01900000-0000-7000-8000-000000000073"
  isRegistrationFlowEnabled: false
  allowedUserTypes:
    - Person
  inboundAuthConfig: |
    - type: oauth2
      config:
        clientId: DEMO_PARTNER_APP
        redirectUris:
          - "http://localhost:5173"
          - "http://localhost:5173/"
        postLogoutRedirectUris:
          - "http://localhost:5173"
          - "http://localhost:5173/"
        grantTypes:
          - authorization_code
          - refresh_token
        responseTypes:
          - code
        tokenEndpointAuthMethod: none
        pkceRequired: true
        publicClient: true
        token:
          accessToken:
            userConfig:
              validityPeriod: 3600
              attributes:
                - given_name
                - family_name
                - email
                - groups
                - name
                - ouId
          idToken:
            validityPeriod: 3600
            userAttributes:
              - given_name
              - family_name
              - email
              - groups
              - name
              - ouId
        scopeClaims:
          profile:
            - name
            - given_name
            - family_name
            - picture
          email:
            - email
            - email_verified
          group:
            - groups
