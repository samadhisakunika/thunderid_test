server:
  hostname: "0.0.0.0" # bind address — must stay 0.0.0.0 so kubelet's pod-IP health checks can
                       # reach it; this is separate from public_url below
  port: __SERVER_PORT__
  public_url: "__PUBLIC_URL__"
  security:
    # file:// reference, not an inline value: the server resolves this by reading the file's
    # content at every boot. The referenced path is exactly where the seed-direct-auth-secret
    # init container writes the operator-generated secret.
    direct_auth_secret: "file://config/secrets/direct_auth_secret"

tls:
  min_version: "__TLS_MIN_VERSION__"
  cert_file: "config/certs/server.cert"
  key_file: "config/certs/server.key"

database:
  __DATABASE_BLOCK__: placeholder # replaced whole-line by reconcileConfigMap with the sqlite or postgres block

crypto:
  encryption:
    key: "file://config/certs/crypto.key"
  password_hashing:
    algorithm: "PBKDF2"
  keys:
    - id: "default-key"
      cert_file: "config/certs/signing.cert"
      key_file: "config/certs/signing.key"
    - id: "ecdsa-key"
      cert_file: "config/certs/ecdsa-signing.cert"
      key_file: "config/certs/ecdsa-signing.key"

jwt:
  preferred_key_id: "__JWT_PREFERRED_KEY_ID__"

passkey:
  allowed_origins:
    - "__PUBLIC_URL__"
    - "__PASSKEY_EXTRA_ORIGINS__" # replaced whole-line by reconcileConfigMap with 0+ additional "- \"origin\"" lines, or removed if spec.config.passkeyExtraAllowedOrigins is unset

__EMAIL_BLOCK__: placeholder # replaced whole-line by reconcileConfigMap with the email: section, or removed if spec.config.email is unset
