---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - ""
  resources:
  - configmaps
  - services
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - ""
  resources:
  - pods
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ""
  resources:
  - pods/log
  verbs:
  - get
- apiGroups:
  - apps
  resources:
  - deployments
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - apps.thunderid.io
  resources:
  - applications
  - flows
  - groups
  - organizationunits
  - resourceservers
  - roles
  - serverconfigs
  - themes
  - thunderidinstances
  - translations
  - users
  - usertypes
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - apps.thunderid.io
  resources:
  - applications/status
  - flows/status
  - groups/status
  - organizationunits/status
  - resourceservers/status
  - roles/status
  - serverconfigs/status
  - themes/status
  - thunderidinstances/status
  - translations/status
  - users/status
  - usertypes/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - apps.thunderid.io
  resources:
  - thunderidinstances/finalizers
  verbs:
  - update
- apiGroups:
  - autoscaling
  resources:
  - horizontalpodautoscalers
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - networking.k8s.io
  resources:
  - ingresses
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
