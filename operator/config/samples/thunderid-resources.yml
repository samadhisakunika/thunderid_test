    prompts:
      - inputs:
          - ref: input_username
            type: TEXT_INPUT
            identifier: username
            required: true
        action:
          ref: action_search
          nextNode: resolve_user
  - id: resolve_user
    type: TASK_EXECUTION
    executor:
      name: IdentifyingExecutor
      mode: resolve
      inputs:
        - type: TEXT_INPUT
          identifier: username
          required: true
    onSuccess: prompt_password
    onFailure: prompt_identifier
    onIncomplete: prompt_disambiguate
  - id: prompt_disambiguate
    type: PROMPT
