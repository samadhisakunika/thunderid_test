    for ThunderID\nurl: https://localhost:8090/console\nlogoUrl: emoji:\U0001F468‍\U0001F4BB\nauthFlowId:
    019ef800-3881-7a3d-9d77-d8080c7db4a2\nregistrationFlowId: 019ef800-38ca-7b15-bef2-4323008ae5d9\nisRegistrationFlowEnabled:
    false\nisRecoveryFlowEnabled: false\nassertion:\n  validityPeriod: 3600\nloginConsent:\n
    \ validityPeriod: 0\nallowedUserTypes:\n  - Person\ninboundAuthConfig:\n  - type:
    oauth2\n    config:\n      clientId: {{.CONSOLE_CLIENT_ID}}\n      redirectUris:\n
    \       {{- range .CONSOLE_REDIRECT_URIS}}\n        - {{.}}\n        {{- end}}\n
    \     grantTypes:\n        - authorization_code\n        - refresh_token\n      responseTypes:\n
    \       - code\n      tokenEndpointAuthMethod: none\n      pkceRequired: true\n
    \     publicClient: true\n      requirePushedAuthorizationRequests: false\n      dpopBoundAccessTokens:
    false\n      includeActClaim: false\n      token:\n        accessToken:\n          validityPeriod:
    3600\n          userAttributes:\n            - given_name\n            - family_name\n
    \           - email\n            - groups\n            - name\n            - ouId\n
    \       idToken:\n          validityPeriod: 3600\n          userAttributes:\n
    \           - given_name\n            - family_name\n            - email\n            -
    groups\n            - name\n            - ouId\n          responseType: JWT\n
    \       refreshToken:\n          validityPeriod: 86400\n      userInfo:\n        responseType:
    JSON\n        userAttributes:\n          - given_name\n          - family_name\n
    \         - email\n          - groups\n          - name\n          - ouId\n      scopeClaims:\n
    \       phone:\n          - phone_number\n          - phone_number_verified\n
    \       profile:\n          - name\n          - given_name\n          - family_name\n
    \         - picture\n        email:\n          - email\n          - email_verified\n
    \       group:\n          - groups\n        ou:\n          - ouId\n\n---\n# File:
    Example_App.yaml\n# resource_type: application\nid: 019ef80e-857d-72bc-a388-bfbc47673df3\nouId:
    019ef800-2f41-7e0c-a156-8ea590c5e97b\nname: Example App\ntemplate: react\nlogoUrl:
    emoji:\U0001FA99\nauthFlowId: 019ef800-36c3-74b3-a4ae-b0f933267cac\nisRegistrationFlowEnabled:
    true\nisRecoveryFlowEnabled: false\nthemeId: 019ef800-3a51-7274-9ec8-f01d1cd62b0d\nassertion:\n
    \ validityPeriod: 3600\nloginConsent:\n  validityPeriod: 0\nallowedUserTypes:\n
    \ - Person\ninboundAuthConfig:\n  - type: oauth2\n    config:\n      clientId:
    {{.EXAMPLE_APP_CLIENT_ID}}\n      redirectUris:\n        {{- range .EXAMPLE_APP_REDIRECT_URIS}}\n
    \       - {{.}}\n        {{- end}}\n      grantTypes:\n        - authorization_code\n
    \       - refresh_token\n      responseTypes:\n        - code\n      tokenEndpointAuthMethod:
    none\n      pkceRequired: true\n      publicClient: true\n      requirePushedAuthorizationRequests:
    false\n      dpopBoundAccessTokens: false\n      includeActClaim: false\n      token:\n
    \       accessToken:\n          validityPeriod: 3600\n        idToken:\n          validityPeriod:
    3600\n        refreshToken:\n          validityPeriod: 86400\n      scopes:\n
    \       - openid\n        - profile\n        - email\n      userInfo:\n        responseType:
    JSON\n\n---\n# File: Default_Basic_Authentication_Flow.yaml\n# resource_type:
    flow\nid: 019ef800-36c3-74b3-a4ae-b0f933267cac\nhandle: default-basic-flow\nname:
    Default Basic Authentication Flow\nflowType: AUTHENTICATION\nactiveVersion: 1\nnodes:\n
    \ - id: start\n    type: START\n    onSuccess: prompt_credentials\n  - id: prompt_credentials\n
    \   type: PROMPT\n    meta: '{\"components\":[{\"alt\":\"{{ t(signin:images.app_logo.alt)
    }}\",\"category\":\"DISPLAY\",\"height\":\"60\",\"id\":\"image\",\"resourceType\":\"ELEMENT\",\"src\":\"{{
    meta(application.logoUrl) }}\",\"type\":\"IMAGE\",\"width\":\"\"},{\"align\":\"center\",\"id\":\"text_001\",\"label\":\"{{
    t(signin:forms.credentials.title) }}\",\"type\":\"TEXT\",\"variant\":\"HEADING_1\"},{\"components\":[{\"id\":\"input_001\",\"label\":\"{{
    t(signin:forms.credentials.fields.username.label) }}\",\"placeholder\":\"{{ t(signin:forms.credentials.fields.username.placeholder)
    }}\",\"ref\":\"username\",\"required\":true,\"type\":\"TEXT_INPUT\"},{\"id\":\"input_002\",\"label\":\"{{
    t(signin:forms.credentials.fields.password.label) }}\",\"placeholder\":\"{{ t(signin:forms.credentials.fields.password.placeholder)
    }}\",\"ref\":\"password\",\"required\":true,\"type\":\"PASSWORD_INPUT\"},{\"category\":\"DISPLAY\",\"id\":\"rich_text_forgot_password\",\"label\":\"\\u003cp
    class=\\\"rich-text-paragraph\\\"\\u003e\\u003cspan class=\\\"rich-text-pre-wrap\\\"\\u003e{{
    t(signin:forms.credentials.links.forgot_password.prefix) }} \\u003c/span\\u003e\\u003ca
    href=\\\"{{meta(application.forgot_password_url)}}\\\" target=\\\"_blank\\\" rel=\\\"noopener
    noreferrer\\\" class=\\\"rich-text-link\\\"\\u003e\\u003cspan class=\\\"rich-text-pre-wrap\\\"\\u003e{{
    t(signin:forms.credentials.links.forgot_password.label) }}\\u003c/span\\u003e\\u003c/a\\u003e\\u003c/p\\u003e\",\"resourceType\":\"ELEMENT\",\"type\":\"RICH_TEXT\"},{\"eventType\":\"SUBMIT\",\"id\":\"action_001\",\"label\":\"{{
    t(signin:forms.credentials.actions.submit.label) }}\",\"type\":\"ACTION\",\"variant\":\"PRIMARY\"},{\"category\":\"DISPLAY\",\"id\":\"rich_text_signup\",\"label\":\"\\u003cp
    class=\\\"rich-text-paragraph\\\"\\u003e\\u003cspan class=\\\"rich-text-pre-wrap\\\"\\u003e{{
    t(signin:forms.credentials.links.sign_up.prefix) }} \\u003c/span\\u003e\\u003ca
    href=\\\"{{meta(application.sign_up_url)}}\\\" target=\\\"_blank\\\" rel=\\\"noopener
    noreferrer\\\" class=\\\"rich-text-link\\\"\\u003e\\u003cspan class=\\\"rich-text-pre-wrap\\\"\\u003e{{
    t(signin:forms.credentials.links.sign_up.label) }}\\u003c/span\\u003e\\u003c/a\\u003e\\u003c/p\\u003e\",\"resourceType\":\"ELEMENT\",\"type\":\"RICH_TEXT\"}],\"id\":\"block_001\",\"type\":\"BLOCK\"}]}'\n
    \   prompts:\n      - inputs:\n          - ref: input_001\n            type: TEXT_INPUT\n
    \           identifier: username\n            required: true\n          - ref:
    input_002\n            type: PASSWORD_INPUT\n            identifier: password\n
    \           required: true\n        action:\n          ref: action_001\n          nextNode:
    credentials_auth\n  - id: credentials_auth\n    type: TASK_EXECUTION\n    executor:\n
    \     name: CredentialsAuthExecutor\n    onSuccess: authorization_check\n    onIncomplete:
    prompt_credentials\n  - id: authorization_check\n    type: TASK_EXECUTION\n    executor:\n
    \     name: AuthorizationExecutor\n    onSuccess: auth_assert\n  - id: auth_assert\n
    \   type: TASK_EXECUTION\n    executor:\n      name: AuthAssertExecutor\n    onSuccess:
    end\n  - id: end\n    type: END\ncreatedAt: 2026-06-24 05:00:24\nupdatedAt: 2026-06-24
    05:00:24\nisReadOnly: false\n\n---\n# File: Default_CIBA_Email_Notification_Flow.yaml\n#
    resource_type: flow\nid: 019ef800-36ea-7c2e-94ac-95d1d4a5c3da\nhandle: default-ciba-email-flow\nname:
    Default CIBA Email Notification Flow\nflowType: AUTHENTICATION\nactiveVersion:
    1\nnodes:\n  - id: start\n    type: START\n    onSuccess: identify_user\n  - id:
    identify_user\n    type: TASK_EXECUTION\n    properties:\n      loginHintAttribute:
    \"username\"\n    executor:\n      name: IdentifyingExecutor\n      inputs:\n
    \       - type: TEXT_INPUT\n          identifier: login_hint\n          required:
    true\n    onSuccess: generate_invite\n  - id: generate_invite\n    type: TASK_EXECUTION\n
    \   executor:\n      name: InviteExecutor\n      mode: generate\n    onSuccess:
    send_notification_email\n  - id: send_notification_email\n    type: TASK_EXECUTION\n
    \   properties:\n      emailTemplate: \"CIBA_NOTIFICATION\"\n    executor:\n      name:
    EmailExecutor\n      mode: send\n      inputs:\n        - type: EMAIL_INPUT\n
    \         identifier: email\n          required: true\n    onSuccess: notification_sent_status\n
    \   onFailure: notification_error_status\n  - id: notification_sent_status\n    type:
    PROMPT\n    meta: '{\"components\":[{\"align\":\"center\",\"id\":\"notification_icon\",\"label\":\"✉️\",\"type\":\"TEXT\",\"variant\":\"HEADING_1\"},{\"align\":\"center\",\"id\":\"notification_heading\",\"label\":\"{{
    t(signin:forms.ciba.notification_sent.heading) }}\",\"type\":\"TEXT\",\"variant\":\"HEADING_1\"},{\"align\":\"center\",\"id\":\"notification_message\",\"label\":\"{{
    t(signin:forms.ciba.notification_sent.message) }}\",\"type\":\"TEXT\",\"variant\":\"HEADING_6\"}]}'\n
    \   next: verify_invite\n    message: Authentication notification sent\n  - id:
    notification_error_status\n    type: PROMPT\n    meta: '{\"components\":[{\"align\":\"center\",\"id\":\"error_icon\",\"label\":\"❌\",\"type\":\"TEXT\",\"variant\":\"HEADING_1\"},{\"align\":\"center\",\"id\":\"error_heading\",\"label\":\"{{
    t(signin:forms.ciba.notification_error.heading) }}\",\"type\":\"TEXT\",\"variant\":\"HEADING_1\"},{\"align\":\"center\",\"id\":\"error_message\",\"label\":\"{{
    t(signin:forms.ciba.notification_error.message) }}\",\"type\":\"TEXT\",\"variant\":\"HEADING_6\"}]}'\n
    \   next: end\n    message: Authentication notification failed\n  - id: verify_invite\n
    \   type: TASK_EXECUTION\n    executor:\n      name: InviteExecutor\n      mode:
    verify\n      inputs:\n        - type: HIDDEN\n          identifier: inviteToken\n
    \         required: true\n    onSuccess: prompt_credentials\n  - id: prompt_credentials\n
    \   type: PROMPT\n    meta: '{\"components\":[{\"align\":\"center\",\"id\":\"credentials_heading\",\"label\":\"{{
    t(signin:forms.ciba.credentials.heading) }}\",\"type\":\"TEXT\",\"variant\":\"HEADING_1\"},{\"align\":\"center\",\"id\":\"credentials_message\",\"label\":\"{{
    t(signin:forms.ciba.credentials.message) }}\",\"type\":\"TEXT\",\"variant\":\"HEADING_6\"},{\"components\":[{\"id\":\"input_password\",\"label\":\"{{
    t(signin:forms.credentials.fields.password.label) }}\",\"placeholder\":\"{{ t(signin:forms.credentials.fields.password.placeholder)
    }}\",\"ref\":\"password\",\"required\":true,\"type\":\"PASSWORD_INPUT\"},{\"eventType\":\"SUBMIT\",\"id\":\"action_approve\",\"label\":\"{{
    t(signin:forms.ciba.credentials.actions.approve.label) }}\",\"type\":\"ACTION\",\"variant\":\"PRIMARY\"}],\"id\":\"block_credentials\",\"type\":\"BLOCK\"}]}'\n
    \   prompts:\n      - inputs:\n          - ref: input_password\n            type:
    PASSWORD_INPUT\n            identifier: password\n            required: true\n
    \       action:\n          ref: action_approve\n          nextNode: credentials_auth\n
    \ - id: credentials_auth\n    type: TASK_EXECUTION\n    executor:\n      name:
    CredentialsAuthExecutor\n    onSuccess: authorization_check\n    onIncomplete:
    prompt_credentials\n  - id: authorization_check\n    type: TASK_EXECUTION\n    executor:\n
    \     name: AuthorizationExecutor\n    onSuccess: auth_assert\n  - id: auth_assert\n
    \   type: TASK_EXECUTION\n    properties:\n      callbackType: \"urn:openid:params:grant-type:ciba\"\n
    \   executor:\n      name: AuthAssertExecutor\n    onSuccess: auth_success\n  -
    id: auth_success\n    type: PROMPT\n    meta: '{\"components\":[{\"align\":\"center\",\"id\":\"success_icon\",\"label\":\"✅\",\"type\":\"TEXT\",\"variant\":\"HEADING_1\"},{\"align\":\"center\",\"id\":\"success_heading\",\"label\":\"{{
    t(signin:forms.ciba.success.heading) }}\",\"type\":\"TEXT\",\"variant\":\"HEADING_1\"},{\"align\":\"center\",\"id\":\"success_message\",\"label\":\"{{
    t(signin:forms.ciba.success.message) }}\",\"type\":\"TEXT\",\"variant\":\"HEADING_6\"}]}'\n
    \   next: end\n    message: Authentication successful\n  - id: end\n    type:
    END\ncreatedAt: 2026-06-24 05:00:24\nupdatedAt: 2026-06-24 05:00:24\nisReadOnly:
    false\n\n---\n# File: Disambiguation_Login_Flow.yaml\n# resource_type: flow\nid:
    019ef800-3710-757b-8aff-686465ef26b6\nhandle: default-disambiguation-login-flow\nname:
    Disambiguation Login Flow\nflowType: AUTHENTICATION\nactiveVersion: 1\nnodes:\n
    \ - id: start\n    type: START\n    onSuccess: prompt_identifier\n  - id: prompt_identifier\n
    \   type: PROMPT\n    meta: '{\"components\":[{\"alt\":\"{{ t(signin:images.app_logo.alt)
    }}\",\"category\":\"DISPLAY\",\"height\":\"60\",\"id\":\"image\",\"resourceType\":\"ELEMENT\",\"src\":\"{{
    meta(application.logoUrl) }}\",\"type\":\"IMAGE\",\"width\":\"\"},{\"align\":\"center\",\"id\":\"text_title\",\"label\":\"{{
    t(signin:forms.credentials.title) }}\",\"type\":\"TEXT\",\"variant\":\"HEADING_1\"},{\"align\":\"center\",\"id\":\"text_subtitle\",\"label\":\"Enter
    your username to get started\",\"type\":\"TEXT\",\"variant\":\"BODY_2\"},{\"components\":[{\"id\":\"input_username\",\"label\":\"{{
    t(signin:forms.credentials.fields.username.label) }}\",\"placeholder\":\"{{ t(signin:forms.credentials.fields.username.placeholder)
    }}\",\"ref\":\"username\",\"required\":true,\"type\":\"TEXT_INPUT\"},{\"eventType\":\"SUBMIT\",\"id\":\"action_search\",\"label\":\"Continue\",\"type\":\"ACTION\",\"variant\":\"PRIMARY\"}],\"id\":\"block_identifier\",\"type\":\"BLOCK\"}]}'\n
    \   prompts:\n      - inputs:\n          - ref: input_username\n            type:
    TEXT_INPUT\n            identifier: username\n            required: true\n        action:\n
    \         ref: action_search\n          nextNode: resolve_user\n  - id: resolve_user\n
    \   type: TASK_EXECUTION\n    executor:\n      name: IdentifyingExecutor\n      mode:
    resolve\n      inputs:\n        - type: TEXT_INPUT\n          identifier: username\n
    \         required: true\n    onSuccess: prompt_password\n    onFailure: prompt_identifier\n
    \   onIncomplete: prompt_disambiguate\n  - id: prompt_disambiguate\n    type:
    PROMPT\n    meta: '{\"components\":[{\"alt\":\"{{ t(signin:images.app_logo.alt)
    }}\",\"category\":\"DISPLAY\",\"height\":\"60\",\"id\":\"image_disambig\",\"resourceType\":\"ELEMENT\",\"src\":\"{{
    meta(application.logoUrl) }}\",\"type\":\"IMAGE\",\"width\":\"\"},{\"align\":\"center\",\"id\":\"text_disambig_title\",\"label\":\"Select
    your department\",\"type\":\"TEXT\",\"variant\":\"HEADING_1\"},{\"align\":\"center\",\"id\":\"text_disambig_subtitle\",\"label\":\"Please
    select your department to continue.\",\"type\":\"TEXT\",\"variant\":\"BODY_2\"},{\"components\":[{\"id\":\"select_ou\",\"label\":\"Department\",\"options\":[],\"placeholder\":\"Select
    your department\",\"ref\":\"ouHandle\",\"required\":true,\"type\":\"SELECT\"},{\"eventType\":\"SUBMIT\",\"id\":\"action_select\",\"label\":\"Continue\",\"type\":\"ACTION\",\"variant\":\"PRIMARY\"}],\"id\":\"block_disambig\",\"type\":\"BLOCK\"}]}'\n
    \   prompts:\n      - inputs:\n          - ref: select_ou\n            type: SELECT\n
    \           identifier: ouHandle\n            required: true\n        action:\n
    \         ref: action_select\n          nextNode: resolve_with_ou\n  - id: resolve_with_ou\n
    \   type: TASK_EXECUTION\n    executor:\n      name: IdentifyingExecutor\n      mode:
    resolve\n      inputs:\n        - type: TEXT_INPUT\n          identifier: username\n
    \         required: true\n        - type: TEXT_INPUT\n          identifier: ouHandle\n
    \         required: true\n    onSuccess: prompt_password\n    onFailure: prompt_identifier\n
    \   onIncomplete: prompt_disambiguate\n  - id: prompt_password\n    type: PROMPT\n
    \   meta: '{\"components\":[{\"alt\":\"{{ t(signin:images.app_logo.alt) }}\",\"category\":\"DISPLAY\",\"height\":\"60\",\"id\":\"image_pw\",\"resourceType\":\"ELEMENT\",\"src\":\"{{
    meta(application.logoUrl) }}\",\"type\":\"IMAGE\",\"width\":\"\"},{\"align\":\"center\",\"id\":\"text_pw_title\",\"label\":\"{{
    t(signin:forms.credentials.title) }}\",\"type\":\"TEXT\",\"variant\":\"HEADING_1\"},{\"align\":\"center\",\"id\":\"text_pw_subtitle\",\"label\":\"Please
    enter your password to sign in.\",\"type\":\"TEXT\",\"variant\":\"BODY_2\"},{\"components\":[{\"id\":\"input_password\",\"label\":\"{{
    t(signin:forms.credentials.fields.password.label) }}\",\"placeholder\":\"{{ t(signin:forms.credentials.fields.password.placeholder)
    }}\",\"ref\":\"password\",\"required\":true,\"type\":\"PASSWORD_INPUT\"},{\"eventType\":\"SUBMIT\",\"id\":\"action_login\",\"label\":\"{{
    t(signin:forms.credentials.actions.submit.label) }}\",\"type\":\"ACTION\",\"variant\":\"PRIMARY\"}],\"id\":\"block_password\",\"type\":\"BLOCK\"}]}'\n
    \   prompts:\n      - inputs:\n          - ref: input_password\n            type:
    PASSWORD_INPUT\n            identifier: password\n            required: true\n
    \       action:\n          ref: action_login\n          nextNode: credentials_auth\n
    \ - id: credentials_auth\n    type: TASK_EXECUTION\n    executor:\n      name:
    CredentialsAuthExecutor\n    onSuccess: authorization_check\n    onIncomplete:
    prompt_password\n  - id: authorization_check\n    type: TASK_EXECUTION\n    executor:\n
    \     name: AuthorizationExecutor\n    onSuccess: auth_assert\n  - id: auth_assert\n
    \   type: TASK_EXECUTION\n    executor:\n      name: AuthAssertExecutor\n    onSuccess:
    end\n  - id: end\n    type: END\ncreatedAt: 2026-06-24 05:00:24\nupdatedAt: 2026-06-24
    05:00:24\nisReadOnly: false\n\n---\n# File: Console_App_Authentication_Flow.yaml\n#
