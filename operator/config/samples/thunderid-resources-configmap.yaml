    t(recovery:forms.username.actions.submit.label) }}\",\"type\":\"ACTION\",\"variant\":\"PRIMARY\"},{\"category\":\"DISPLAY\",\"id\":\"rich_text_signup\",\"label\":\"\\u003cp
    class=\\\"rich-text-paragraph\\\"\\u003e\\u003cspan class=\\\"rich-text-pre-wrap\\\"\\u003e{{
    t(recovery:forms.username.links.sign_in.prefix) }} \\u003c/span\\u003e\\u003ca
