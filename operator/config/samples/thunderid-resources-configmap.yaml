    resource_type: flow\nid: 019ef800-37f7-786c-9baf-9131ae0cce82\nhandle: email-link-based-password-recovery\nname:
    Email Link Password Recovery Flow\nflowType: RECOVERY\nactiveVersion: 1\nnodes:\n
    \ - id: start\n    type: START\n    layout:\n      size:\n        width: 101\n
    \       height: 34\n      position:\n        x: 0\n        y: 400\n    onSuccess:
    prompt_username\n  - id: prompt_username\n    type: PROMPT\n    layout:\n      size:\n
    \       width: 350\n        height: 431\n      position:\n        x: 200\n        y:
    250\n    meta: '{\"components\":[{\"align\":\"center\",\"id\":\"text_header_username\",\"label\":\"{{
    t(recovery:forms.username.title) }}\",\"type\":\"TEXT\",\"variant\":\"HEADING_1\"},{\"id\":\"text_subtitle_username\",\"label\":\"{{
