apiVersion: apps.thunderid.io/v1alpha1
kind: ResourceServer
metadata:
  name: test-resourceserver
  namespace: default
spec:
  instanceRef: thunderid-prod
  name: System
  description: System resource server
  identifier: https://localhost:8090/mcp
  ouHandle: test-ou
  resources:
    - name: System
      handle: system
      description: System resource
    - name: Organization Unit
      handle: ou
      description: Organization unit resource
      parent: system
      actions:
        - name: View
          handle: view
          description: Read-only access to organization units
    - name: User
      handle: user
      description: User resource
      parent: system
      actions:
        - name: View
          handle: view
          description: Read-only access to users
    - name: Group
      handle: group
      description: Group resource
      parent: system
      actions:
        - name: View
          handle: view
          description: Read-only access to groups
    - name: User Type
      handle: usertype
      description: User type resource
      parent: system
      actions:
        - name: View
          handle: view
          description: Read-only access to user types
