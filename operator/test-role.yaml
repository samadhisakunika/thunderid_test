  namespace: default
  labels:
    thunderid.io/instance: thunderid-prod
spec:
  config:
    name: Test Role
    description: A simple test role for verifying the Role controller.
    ouHandle: test-ou  # matches spec.config.handle on the "test-ou" OrganizationUnit CR
