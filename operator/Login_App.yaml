apiVersion: apps.thunderid.io/v1alpha1
kind: Application
metadata:
  name: login-app
  namespace: default
spec:
  instanceRef: thunderid-prod
  name: Login App
  description: Sample login application
  logoUrl: emoji:✈️
  ouId: "019ef85a-0aa4-7736-9357-d25edba4db95" # default OU
  authFlowId: "019ef85a-0db4-7283-a084-c02463811df4" # console-app-flow (Console App Authentication Flow, not the Registration one which shares the same handle)
  isRegistrationFlowEnabled: false
  assertion:
    validityPeriod: 3600
  loginConsent:
    validityPeriod: 0
  allowedUserTypes:
    - Person
  template: browser
  inboundAuthConfig: |
    - type: oauth2
      config:
        clientId: SAMPLE_CLIENT_ID
        redirectUris:
          - "https://localhost:3000"
        grantTypes:
          - authorization_code
          - refresh_token
        responseTypes:
          - code
        tokenEndpointAuthMethod: none
        pkceRequired: true
        publicClient: true
        token:
          accessToken:
            userConfig:
              validityPeriod: 3600
              attributes:
                - family_name
                - email
                - groups
          idToken:
            validityPeriod: 3600
            userAttributes:
              - given_name
              - family_name
              - email
              - groups
        scopeClaims:
          email:
            - email
            - email_verified
          group:
            - groups
          profile:
            - given_name
            - family_name