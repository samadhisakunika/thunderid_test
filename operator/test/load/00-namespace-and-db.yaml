apiVersion: v1
kind: Namespace
metadata:
  name: loadtest
---
apiVersion: v1
kind: Secret
metadata:
  name: loadtest-pg-secret
  namespace: loadtest
stringData:
  POSTGRES_PASSWORD: "loadtest123"
  password: "loadtest123"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loadtest-pgdb
  namespace: loadtest
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: loadtest-pgdb
  template:
    metadata:
      labels:
        app: loadtest-pgdb
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: "postgres"
            - name: POSTGRES_DB
              value: "thunderid_config"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: loadtest-pg-secret
                  key: POSTGRES_PASSWORD
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 5
            periodSeconds: 5
          lifecycle:
            postStart:
              exec:
                command: ["sh", "-c", "until pg_isready -U postgres; do sleep 1; done; createdb -U postgres thunderid_runtime || true"]
---
apiVersion: v1
kind: Service
metadata:
  name: loadtest-pgdb
  namespace: loadtest
spec:
  selector:
    app: loadtest-pgdb
  ports:
    - port: 5432
      targetPort: 5432
