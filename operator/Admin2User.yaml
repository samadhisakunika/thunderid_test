apiVersion: apps.thunderid.io/v1alpha1
kind: Resource
metadata:
  name: admin2
  namespace: default
  labels:
    thunderid.io/instance: thunderid-prod
spec:
  resource_type: user
  type: Person
  ouHandle: test-ou
  attributes:
    given_name: "Admin"
    name: "Administrator"
    phone_number: "+12345678920"
    picture: "https://example.com/avatar.jpg"
    sub: "admin"
    username: "admin"
    email: "admin@example.com"
    family_name: "User"
  credentialsSecretRef: admin2-credentials
