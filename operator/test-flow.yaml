apiVersion: apps.thunderid.io/v1alpha1
kind: Flow
metadata:
  name: my-custom-login
  namespace: default
spec:
  instanceRef: test-resources
  handle: my-custom-login
  name: My Custom Login Flow 2
  flowType: AUTHENTICATION
  nodes: '[{"id":"start","type":"START","onSuccess":"username-password"},{"id":"username-password","type":"TASK_EXECUTION","executor":{"name":"UsernamePasswordAuthenticator"},"onSuccess":"end","onFailure":"username-password-prompt","onIncomplete":"username-password-prompt"},{"id":"username-password-prompt","type":"PROMPT","prompts":[{"inputs":[{"type":"text","identifier":"username","required":true},{"type":"password","identifier":"password","required":true}],"action":{"ref":"submit","nextNode":"username-password"}}]},{"id":"end","type":"END"}]'
