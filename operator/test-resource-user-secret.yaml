# external-pg-instance's shared env file (see thunderidinstance.yaml's spec.envSecretRef),
# authored via the Environment CRD rather than a hand-written Secret. Applying this makes the
# operator create (or update) a Secret named external-pg-instance-env holding these key-value
# pairs, then mask each synced key's value in place here (see environment_controller.go) —
# this object is never deleted, `kubectl get environment external-pg-instance-env` keeps
# working. To change a value later, re-apply this file with new plaintext for that key.
#
# Apply with `kubectl apply --server-side -f test-resource-user-secret.yaml`, not plain
# `kubectl apply` — plain apply stores this file's plaintext verbatim in the
# kubectl.kubernetes.io/last-applied-configuration annotation forever, bypassing the masking
# above entirely (see operator/gitops/README.md). First switch-over on an already-existing
# object may need `--force-conflicts` once.
apiVersion: apps.thunderid.io/v1alpha1
kind: Environment
metadata:
  name: external-pg-instance-env
  namespace: default
spec:
  env:
    TEST_RESOURCE_USER_PASSWORD: change-me-too
