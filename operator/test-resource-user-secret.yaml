# external-pg-instance's shared env file (see thunderidinstance.yaml's spec.envSecretRef),
# authored via the Environment CRD rather than a hand-written Secret. Applying this makes the
# operator create (or update) a Secret named external-pg-instance-env holding these key-value
# pairs, then delete this Environment object — it's a one-shot trigger, not a persistent object
# (see environment_controller.go). To change values later, re-apply this file; it'll update the
# existing Secret and self-delete again.
apiVersion: apps.thunderid.io/v1alpha1
kind: Environment
metadata:
  name: external-pg-instance-env
  namespace: default
spec:
  env:
    TEST_RESOURCE_USER_PASSWORD: change-me-too
